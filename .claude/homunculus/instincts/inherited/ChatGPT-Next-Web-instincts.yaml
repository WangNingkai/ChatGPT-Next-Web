# ChatGPT Next Web Workflow Add Unit Test For Helper

## Action

Follow the add-unit-test-for-helper workflow:
1. Identify a helper or utility function that lacks test coverage.
2. Create a new test file named after the helper in the 'test/' directory (e.g., test/helper-name.test.ts).
3. Write focused, additive unit tests covering all relevant branches and cases for the helper.
4. Ensure no existing files are modified or removed.
5. Verify tests pass locally (e.g., yarn test:ci).
6. Commit the new test file with a descriptive message.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~15x per month
- Files: test/*.test.ts

